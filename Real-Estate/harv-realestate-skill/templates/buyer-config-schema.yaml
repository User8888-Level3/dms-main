# Schema reference for CLIENT.md frontmatter (place between --- markers at top of CLIENT.md)
# Convention: optional fields should be OMITTED if unset (not set to 0 or "" — those are real values).
# `null` shown below is for documentation; in actual CLIENT.md files, just leave the line out.
client_name: "Full Legal Name (Preferred Name)"  # required
client_role: buyer                                # required: buyer | seller
target_close_date: null                           # optional, "YYYY-MM-DD"
max_price: null                                   # optional, integer USD (omit for no upper bound)
min_price: null                                   # optional, integer USD
preferred_areas: []                               # optional, list of city names
must_haves: []                                    # optional, list of strings
nice_to_haves: []                                 # optional
deal_breakers: []                                 # optional
lot_threshold_sqft: null                          # optional, integer; renders lot flag if set
hubspot_contact_id: null                          # optional, HubSpot contact ID
