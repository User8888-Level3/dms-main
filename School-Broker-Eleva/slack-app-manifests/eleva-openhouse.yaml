display_information:
  name: Eleva Open House Bot
  description: 24/7 Claude on Eleva, scoped to Open House workspace
  background_color: "#1a1a1a"

features:
  bot_user:
    display_name: Eleva Open House Bot
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - files:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
