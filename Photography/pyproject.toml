[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-index"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.2",
  "pillow-heif>=0.16",
  "imagehash>=4.3",
  "piexif>=1.1.3",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[tool.setuptools.packages.find]
include = ["photo_index*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
